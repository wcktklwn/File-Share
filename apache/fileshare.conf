# Themed directory index for the shared folder.
# Theme files live outside the share and are exposed only at /_theme/.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

AddDefaultCharset UTF-8
AddType text/plain .md .markdown .log .csv .tsv .rst

<IfModule headers_module>
    Header set X-Content-Type-Options "nosniff"
    Header set Referrer-Policy "no-referrer"
    Header set X-Frame-Options "SAMEORIGIN"
</IfModule>

# Always show the listing, even when a directory contains index.html.
DirectoryIndex disabled

Alias /_theme/ "/usr/local/apache2/theme/"

<Directory "/usr/local/apache2/theme">
    Options None
    AllowOverride None
    Require all granted
</Directory>

<Directory "/srv/share">
    Options Indexes
    AllowOverride None
    Require all granted

    IndexOptions FancyIndexing HTMLTable VersionSort FoldersFirst IgnoreCase
    IndexOptions IconsAreLinks SuppressRules SuppressDescription NameWidth=*
    IndexOptions Charset=UTF-8 XHTML AddAltClass IconWidth=20 IconHeight=20
    IndexOptions TrackModified
    IndexOrderDefault Ascending Name
    IndexStyleSheet "/_theme/style.css"
    IndexHeadInsert "<meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><link rel=\"icon\" href=\"/_theme/favicon.svg\" type=\"image/svg+xml\">"
    ReadmeName /_theme/footer.html

    IndexIgnore .??* *~ *# .DS_Store Thumbs.db

    AddIcon (Folder,/_theme/icons/folder.svg) ^^DIRECTORY^^
    AddIcon (Parent,/_theme/icons/up.svg) ..
    AddIcon (Code,/_theme/icons/code.svg) .js .mjs .cjs .ts .tsx .jsx .py .go .rs .java .c .h .cpp .hpp .rb .php .sh .zsh .bash .css .scss .json .xml .yml .yaml .toml .sql .lua .swift .kt
    AddIcon (Archive,/_theme/icons/archive.svg) .zip .tar .gz .tgz .bz2 .tbz2 .xz .7z .rar
    AddIcon (Document,/_theme/icons/doc.svg) .pdf .doc .docx .odt .rtf .ppt .pptx .xls .xlsx .odp .ods .pages .key .numbers .html .htm
    AddIcon (Text,/_theme/icons/text.svg) .txt .md .markdown .csv .tsv .log .rst .org
    AddIconByType (Image,/_theme/icons/image.svg) image/*
    AddIconByType (Video,/_theme/icons/video.svg) video/*
    AddIconByType (Audio,/_theme/icons/audio.svg) audio/*
    AddIconByType (Text,/_theme/icons/text.svg) text/*
    AddIconByType (Document,/_theme/icons/doc.svg) application/pdf
    AddIconByType (Archive,/_theme/icons/archive.svg) application/zip application/gzip application/x-gzip application/x-tar application/x-bzip2 application/x-7z-compressed application/vnd.rar
    AddIconByType (Code,/_theme/icons/code.svg) application/json application/xml application/javascript text/javascript application/yaml
    DefaultIcon /_theme/icons/file.svg

    # Keep hidden and editor files out of the listing and off direct URLs.
    <FilesMatch "(^\.)|(~$)|(^#)|(\.swp$)">
        Require all denied
    </FilesMatch>
</Directory>
